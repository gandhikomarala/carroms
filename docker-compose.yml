version: '3.8'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://carrom_user:carrom_pass@db:5432/carrom_arena
      - JWT_SECRET=carrom_arena_secret_jwt_key_2026
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-placeholder}
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=carrom_user
      - POSTGRES_PASSWORD=carrom_pass
      - POSTGRES_DB=carrom_arena
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
